<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add pinboard item</title>
        <link rel="stylesheet" href="../global.css">
        <link rel="stylesheet" href="add-pinboard-item.css">
    </head>
    <body>
    <div class="add-pinboard-container">
        <h1>Add pinboard item</h1>
        <form id="add-pinboard-item-form" enctype="multipart/form-data">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="text">Text</label>
            <textarea id="text" name="text" required></textarea>

            <button type="button" id="add-attachment-btn" class="btn">Add Attachment</button>

            <div id="attachment-form" style="display: none; margin-top: 1rem; padding: 1rem; border: 1px solid var(--border-main); border-radius: 8px;">
                <h3>Attachment</h3>
                <label for="attachment">File</label>
                <input type="file" id="attachment" name="attachment">

                <label for="file-type">File Type</label>
                <select id="file-type" name="file-type">
                    <!-- Options will be populated by JS -->
                </select>

                <label for="path-type">Path Type</label>
                <select id="path-type" name="path-type">
                    <!-- Options will be populated by JS -->
                </select>
            </div>

            <button type="submit">Add</button>
            <div class="error" id="error-msg"></div>
        </form>
        <a class="back-link" href="../index.html">Back to pinboard</a>
    </div>
    <script src="../tools/backend.js"></script>
    <script src="../tools/auth.js"></script>
    <script src="add-pinboard-item.js"></script>
    </body>
</html>
